<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Turístico de Fronteira-MG</title>
    <link rel="stylesheet" href="w3.css">
</head>

<body class="w3-center" style="background-color: rgb(7, 4, 22);">

    <div class="w3-round-large w3-dark-grey w3-margin">
        <h1 class="w3-padding-32" style="color: white;">
            Guia turístico da cidade de Fronteira-MG
        </h1>
    </div>

    <div class="w3-row w3-margin">

        <div class="w3-third">
            <div class="w3-light-grey w3-padding w3-round-large">
                <img src="imagens/hidrelétrica.jpg" alt="Usina Hidrelétrica de Marimbondo" class="w3-animate-zoom w3-round-xxlarge w3-image">
                <p>Usina Hidrelétrica de Marimbondo</p>
            </div>
            <div class="w3-light-grey w3-padding w3-round-large">
                <img src="imagens/artesanato.jpg" alt="Usina Hidrelétrica de Marimbondo" class="w3-animate-zoom w3-round-xxlarge w3-image">
                <p>Casa do Artesanato</p>
            </div>
            <div class="w3-light-grey w3-padding w3-round-large">
                <img src="imagens/bernadao.jpg" alt="Usina Hidrelétrica de Marimbondo" class="w3-animate-zoom w3-round-xxlarge w3-image">
                <p>Estátua do Bernadão</p>
            </div>
        </div>

        <div class="w3-third">
            <div class="w3-light-grey w3-padding w3-round-large">
                <img src="imagens/cachoeira.jpg" alt="Cachoeira do Domingão" class="w3-animate-zoom w3-round-xxlarge w3-image">
                <p>Cachoeira do Domingão</p>
            </div>
            <div class="w3-light-grey w3-padding w3-round-large">
                <img src="imagens/feira.jpg" alt="Cachoeira do Domingão" class="w3-animate-zoom w3-round-xxlarge w3-image">
                <p>Feira</p>
            </div>
            <div class="w3-light-grey w3-padding w3-round-large">
                <img src="imagens/pantano.jpg" alt="Cachoeira do Domingão" class="w3-animate-zoom w3-round-xxlarge w3-image">
                <p>Pântano</p>
            </div>
        </div>

        <div class="w3-third">
            <div class="w3-green w3-padding w3-round-large">
                <h2>Cidade</h2>
                <p>Fronteira-MG possui locais interessantes para lazer, turismo e contato com a natureza.</p>
            </div>
        </div>
    </div>

    </div>

</body>

</html>
